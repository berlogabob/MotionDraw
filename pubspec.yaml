name: motiondraw
description: "Camera motion and still scenes turned into scale-quantised notes."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  camera: ^0.12.0+2
  camera_macos: ^0.1.1
  flutter:
    sdk: flutter
  flutter_soloud: ^4.1.7
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
